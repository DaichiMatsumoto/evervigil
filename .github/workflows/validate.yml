name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Capture persistent PATH baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pathSnapshotPath = Join-Path `
            ([IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')) `
            "evervigil-path-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $pathSnapshot = [ordered]@{
            user = [Environment]::GetEnvironmentVariable(
              'Path',
              [EnvironmentVariableTarget]::User)
            machine = [Environment]::GetEnvironmentVariable(
              'Path',
              [EnvironmentVariableTarget]::Machine)
          }
          [IO.File]::WriteAllText(
            $pathSnapshotPath,
            (($pathSnapshot | ConvertTo-Json -Compress) + "`n"),
            [Text.UTF8Encoding]::new($false))
          "EVERVIGIL_PATH_SNAPSHOT=$pathSnapshotPath" >> $env:GITHUB_ENV
          'DOTNET_ADD_GLOBAL_TOOLS_TO_PATH=0' >> $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.130

      - name: Validate repository
        shell: pwsh
        run: .\tests\Test-Repository.ps1

      - name: Test system maintenance
        shell: pwsh
        run: .\tests\Test-SystemMaintenance.ps1

      - name: Initialize isolated dependency caches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path `
            ([IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')) `
            "evervigil-dependencies-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) {
            throw 'The validation dependency root was not freshly allocated.'
          }
          $paths = [ordered]@{
            DOTNET_CLI_HOME = Join-Path $root 'dotnet-cli-home'
            NUGET_PACKAGES = Join-Path $root 'packages'
            NUGET_HTTP_CACHE_PATH = Join-Path $root 'http-cache'
            NUGET_PLUGINS_CACHE_PATH = Join-Path $root 'plugins-cache'
            MSBuildUserExtensionsPath = Join-Path $root 'msbuild-user-extensions'
            APPDATA = Join-Path $root 'app-data'
            LOCALAPPDATA = Join-Path $root 'local-app-data'
            USERPROFILE = Join-Path $root 'user-profile'
          }
          foreach ($entry in $paths.GetEnumerator()) {
            [IO.Directory]::CreateDirectory([string]$entry.Value) | Out-Null
            $item = Get-Item -LiteralPath ([string]$entry.Value) -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "An isolated validation directory is a reparse point: $($entry.Key)"
            }
            "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV
          }
          'DOTNET_CLI_TELEMETRY_OPTOUT=1' >> $env:GITHUB_ENV
          'DOTNET_NOLOGO=1' >> $env:GITHUB_ENV
          'DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1' >> $env:GITHUB_ENV

      - name: Restore
        run: >-
          dotnet restore .\EverVigil.sln
          --configfile .\NuGet.config
          --packages $env:NUGET_PACKAGES
          --locked-mode
          -r win-x64
          --disable-parallel
          -m:1
          -p:RestoreBuildInParallel=false
          -p:ContinuousIntegrationBuild=true
          -p:RestoreConfigFile=$env:GITHUB_WORKSPACE\NuGet.config
          -p:RestorePackagesPath=$env:NUGET_PACKAGES
          -p:RestoreSources=https://api.nuget.org/v3/index.json
          -p:RestoreFallbackFolders=
          -p:RestoreAdditionalProjectSources=
          -p:RestoreAdditionalProjectFallbackFolders=
          -p:RestorePackagesWithLockFile=true
          -p:RestoreLockedMode=true

      - name: Restore NativeAOT broker graph
        run: >-
          dotnet restore .\src\EverVigil.Broker\EverVigil.Broker.csproj
          --configfile .\NuGet.config
          --packages $env:NUGET_PACKAGES
          --locked-mode
          -r win-x64
          --disable-parallel
          -m:1
          -p:Configuration=Release
          -p:PublishAot=true
          -p:RestoreBuildInParallel=false
          -p:ContinuousIntegrationBuild=true
          -p:RestoreConfigFile=$env:GITHUB_WORKSPACE\NuGet.config
          -p:RestorePackagesPath=$env:NUGET_PACKAGES
          -p:RestoreSources=https://api.nuget.org/v3/index.json
          -p:RestoreFallbackFolders=
          -p:RestoreAdditionalProjectSources=
          -p:RestoreAdditionalProjectFallbackFolders=
          -p:RestorePackagesWithLockFile=true
          -p:RestoreLockedMode=true

      - name: Build
        run: >-
          dotnet build .\EverVigil.sln
          -c Release
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Test Inno compiler fallback
        shell: pwsh
        run: .\tests\Test-InnoCompiler.ps1

      - name: Test install transactions
        shell: pwsh
        run: .\tests\Test-InstallTransaction.ps1

      - name: Test executable resource audit
        shell: pwsh
        run: .\tests\Test-ReleaseResourceAudit.ps1

      - name: Verify formatting
        run: dotnet format .\EverVigil.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Test core
        run: dotnet run --project .\tests\EverVigil.Tests\EverVigil.Tests.csproj -c Release --no-build

      - name: Test privileged broker
        run: dotnet run --project .\tests\EverVigil.Broker.Tests\EverVigil.Broker.Tests.csproj -c Release --no-build

      - name: Audit NuGet packages
        shell: pwsh
        run: .\scripts\Test-NuGetVulnerabilities.ps1 -SolutionPath .\EverVigil.sln

      - name: Build and inspect release package
        id: release
        shell: pwsh
        run: |
          $project = [xml](Get-Content .\src\EverVigil\EverVigil.csproj -Raw)
          $version = [string]$project.Project.PropertyGroup.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          .\scripts\Build-Release.ps1 -Version $version -BrokerTestSkipPolicy Report

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EverVigil-${{ steps.release.outputs.version }}-Setup
          path: artifacts/release/EverVigil-${{ steps.release.outputs.version }}-Setup.exe
          if-no-files-found: error

      - name: Verify persistent PATH remained unchanged
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:EVERVIGIL_PATH_SNAPSHOT) -or
            -not (Test-Path -LiteralPath $env:EVERVIGIL_PATH_SNAPSHOT -PathType Leaf)) {
            throw 'The persistent PATH baseline is missing.'
          }
          $snapshot = Get-Content `
            -LiteralPath $env:EVERVIGIL_PATH_SNAPSHOT `
            -Raw | ConvertFrom-Json
          $currentUserPath = [Environment]::GetEnvironmentVariable(
            'Path',
            [EnvironmentVariableTarget]::User)
          $currentMachinePath = [Environment]::GetEnvironmentVariable(
            'Path',
            [EnvironmentVariableTarget]::Machine)
          $userPathMatches = if ($null -eq $snapshot.user) {
            $null -eq $currentUserPath
          } else {
            [string]::Equals(
              [string]$snapshot.user,
              $currentUserPath,
              [StringComparison]::Ordinal)
          }
          $machinePathMatches = if ($null -eq $snapshot.machine) {
            $null -eq $currentMachinePath
          } else {
            [string]::Equals(
              [string]$snapshot.machine,
              $currentMachinePath,
              [StringComparison]::Ordinal)
          }
          if (-not $userPathMatches -or -not $machinePathMatches) {
            throw 'A validation step changed a persistent Windows PATH.'
          }
